name: build

# Runnable Kip app folders for Linux + Windows, uploaded as artifacts. On a
# v* tag it also attaches them to a GitHub Release.
#
# Free-tier conscious:
#   * manual runs default to Linux only (1x minutes); pick "windows" or "both".
#   * a v* tag always builds both and makes a Release.
#   * artifacts kept 5 days (private storage is only 500 MB free — the electron
#     runtime makes each ~90 MB).
#   * ~/.m2 + the yarn cache are cached (separate 10 GB budget, free).
#
# Needs: repo secret KIP_SCRIPTS_TOKEN = a PAT with Contents:read on
# JWE24-code/kip (checked out as a sibling of app/). electron-forge is NOT
# used — the packaging/ scripts hand-assemble (see docs/BUILD.md).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform(s) to build"
        type: choice
        options: [linux, windows, both]
        default: linux
      cljs_mode:
        description: "cljs build (compile = safe, release = optimized/experimental)"
        type: choice
        options: [compile, release]
        default: compile
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # for the Release on a tag

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          plat='${{ github.event.inputs.platform || 'linux' }}'
          [ '${{ startsWith(github.ref, 'refs/tags/v') }}' = 'true' ] && plat=both
          lin='{"os":"ubuntu-latest","name":"linux-x64","script":"bash app/packaging/linux/build.sh"}'
          win='{"os":"windows-2022","name":"windows-x64","script":"pwsh app/packaging/windows/build.ps1"}'
          case "$plat" in
            linux)   inc="[$lin]" ;;
            windows) inc="[$win]" ;;
            both)    inc="[$lin,$win]" ;;
          esac
          echo "matrix={\"include\":$inc}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # manual runs: the dropdown (default compile, fast). v* tags: always
      # release (optimized) — validated on CI 2026-08-28.
      KIP_CLJS: ${{ github.event.inputs.cljs_mode || (startsWith(github.ref, 'refs/tags/v') && 'release' || 'compile') }}

    steps:
      - name: Checkout kip-app
        uses: actions/checkout@v5
        with:
          path: app
          fetch-depth: 1

      - name: Checkout kip (retrieval layer)
        uses: actions/checkout@v5
        with:
          repository: JWE24-code/kip
          token: ${{ secrets.KIP_SCRIPTS_TOKEN }}
          path: _kip
          fetch-depth: 1

      - name: Place scripts/ next to app/
        shell: bash
        run: mv _kip/scripts ./scripts && rm -rf _kip

      - name: Free disk space (linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup || true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest
          github-token: ${{ github.token }}

      - name: Cache Maven / Clojure deps
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('app/deps.edn') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            ~/AppData/Local/Yarn/Cache
          key: yarn-${{ runner.os }}-${{ hashFiles('app/yarn.lock', 'app/resources/package.json') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install Yarn 1 (classic — this repo's yarn.lock is v1)
        shell: bash
        run: npm install -g yarn@1.22.22

      - name: Build + assemble
        shell: bash
        run: ${{ matrix.script }}

      # ---- Authenticode signing (disabled) -------------------------------
      # Kip v0.1 ships unsigned (SmartScreen note is in the README). To turn
      # signing on, pick ONE of the blocks below and set its secrets. See
      # .claude/RELEASE-signing.md for the full analysis.
      #
      # Azure Trusted Signing (~$10/mo, cloud, no token):
      #   - name: Azure login
      #     if: runner.os == 'Windows'
      #     uses: azure/login@v2
      #     with:
      #       client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #       tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #       subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #   - name: Sign
      #     if: runner.os == 'Windows'
      #     uses: azure/trusted-signing-action@v0
      #     with:
      #       endpoint: ${{ secrets.AZ_SIGN_ENDPOINT }}
      #       trusted-signing-account-name: ${{ secrets.AZ_SIGN_ACCOUNT }}
      #       certificate-profile-name: ${{ secrets.AZ_SIGN_PROFILE }}
      #       files-folder: app/out/Kip-win32-x64
      #       files-folder-filter: exe,dll
      #       files-folder-recurse: true
      #
      # SignPath.io Foundation (free for OSS — apply first): sign the uploaded
      # artifact with signpath/github-action-submit-signing-request@v1 in a
      # separate job that `needs: build`, using a signpath.json policy.

      - name: Package
        shell: bash
        run: |
          v=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' app/src/main/frontend/version.cljs | head -1)
          ws="$PWD"
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="Kip-$v-${{ matrix.name }}.zip"
            ( cd app/out/Kip-win32-x64 && 7z a -mx=5 "$ws/$asset" . >/dev/null )
          else
            asset="Kip-$v-${{ matrix.name }}.tar.gz"
            tar -C app/out -czf "$asset" Kip-linux-x64
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Smoke test (linux — the bundled retrieval layer runs under Electron-as-Node)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          mkdir -p /tmp/coop/.roost
          ELECTRON_RUN_AS_NODE=1 KIP_COOP_ROOT=/tmp/coop \
            app/out/Kip-linux-x64/kip app/out/Kip-linux-x64/resources/app/scripts/reminders.js list --json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 5
          compression-level: 0   # the asset is already compressed

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" \
            --notes "Automated build." --repo "${{ github.repository }}" 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" "${{ env.ASSET }}" --clobber --repo "${{ github.repository }}"
