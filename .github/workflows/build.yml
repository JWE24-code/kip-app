name: build

# Runnable Kip app folders for Linux + Windows, uploaded as artifacts. On a
# v* tag it also attaches them to a GitHub Release.
#
# Free-tier conscious:
#   * manual runs default to Linux only (1x minutes); pick "windows" or "both".
#   * a v* tag always builds both and makes a Release.
#   * artifacts kept 5 days (private storage is only 500 MB free — the electron
#     runtime makes each ~90 MB).
#   * ~/.m2 + the yarn cache are cached (separate 10 GB budget, free).
#
# Needs: repo secret KIP_SCRIPTS_TOKEN = a PAT with Contents:read on
# JWE24-code/kip (checked out as a sibling of app/). electron-forge is NOT
# used — the packaging/ scripts hand-assemble (see docs/BUILD.md).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform(s) to build"
        type: choice
        options: [linux, windows, both]
        default: linux
      cljs_mode:
        description: "cljs build (compile = safe, release = optimized/experimental)"
        type: choice
        options: [compile, release]
        default: compile
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # for the Release on a tag

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          plat='${{ github.event.inputs.platform || 'linux' }}'
          [ '${{ startsWith(github.ref, 'refs/tags/v') }}' = 'true' ] && plat=both
          lin='{"os":"ubuntu-latest","name":"linux-x64","script":"bash app/packaging/linux/build.sh"}'
          win='{"os":"windows-2022","name":"windows-x64","script":"pwsh app/packaging/windows/build.ps1"}'
          case "$plat" in
            linux)   inc="[$lin]" ;;
            windows) inc="[$win]" ;;
            both)    inc="[$lin,$win]" ;;
          esac
          echo "matrix={\"include\":$inc}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # manual runs: the dropdown (default compile, fast). v* tags: always
      # release (optimized) — validated on CI 2026-08-28.
      KIP_CLJS: ${{ github.event.inputs.cljs_mode || (startsWith(github.ref, 'refs/tags/v') && 'release' || 'compile') }}
      # Windows Authenticode: a base64 PFX + its password. Currently a
      # self-signed code-signing cert (SmartScreen still warns "unknown
      # publisher" — it gives the binary a stable identity and lets the
      # updater verify signature continuity). Swap the two secrets for a real
      # cert later; nothing else changes. Empty on forks -> build.ps1 skips
      # signing.
      KIP_SIGN_PFX_B64: ${{ secrets.KIP_SIGN_PFX_B64 }}
      KIP_SIGN_PFX_PASSWORD: ${{ secrets.KIP_SIGN_PFX_PASSWORD }}

    steps:
      - name: Checkout kip-app
        uses: actions/checkout@v5
        with:
          path: app
          fetch-depth: 1

      - name: Checkout kip (retrieval layer)
        uses: actions/checkout@v5
        with:
          repository: JWE24-code/kip
          token: ${{ secrets.KIP_SCRIPTS_TOKEN }}
          path: _kip
          fetch-depth: 1

      - name: Place scripts/ next to app/
        shell: bash
        run: mv _kip/scripts ./scripts && rm -rf _kip

      - name: Free disk space (linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup || true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest
          github-token: ${{ github.token }}

      - name: Cache Maven / Clojure deps
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('app/deps.edn') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            ~/AppData/Local/Yarn/Cache
          key: yarn-${{ runner.os }}-${{ hashFiles('app/yarn.lock', 'app/resources/package.json') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install Yarn 1 (classic — this repo's yarn.lock is v1)
        shell: bash
        run: npm install -g yarn@1.22.22

      - name: Prepare code-signing (Windows)
        if: runner.os == 'Windows' && env.KIP_SIGN_PFX_B64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'kip-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:KIP_SIGN_PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found on the runner' }
          # build.ps1 appends each target path to this command.
          $cmd = '"{0}" sign /fd SHA256 /f "{1}" /p "{2}" /tr http://timestamp.digicert.com /td SHA256' -f `
            $signtool, $pfx, $env:KIP_SIGN_PFX_PASSWORD
          "KIP_SIGN_CMD=$cmd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build + assemble
        shell: bash
        run: ${{ matrix.script }}

      # Windows binaries are Authenticode-signed by build.ps1 when KIP_SIGN_CMD
      # is set (the "Prepare code-signing" step above builds it from the
      # KIP_SIGN_PFX_* secrets). Today that's a self-signed cert — SmartScreen
      # still warns, but the binary has a stable publisher identity and the
      # updater can verify signature continuity. To move to a real cert (Azure
      # Trusted Signing, a purchased OV/EV cert, or SignPath OSS) just replace
      # the two secrets, or swap the "Prepare code-signing" step for that
      # provider's action — build.ps1 and everything downstream is unchanged.
      # See docs/signing.md.

      - name: Package
        shell: bash
        run: |
          v=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' app/src/main/frontend/version.cljs | head -1)
          ws="$PWD"
          [ "${{ runner.os }}" = "Windows" ] && outdir=app/out/Kip-win32-x64 || outdir=app/out/Kip-linux-x64

          # the packaged app must actually contain code — guards against a
          # silently-failed asar step leaving an empty resources/ that
          # upload-artifact would just skip (shipping a codeless app)
          test -f "$outdir/resources/app.asar" || { echo "::error::$outdir has no resources/app.asar"; exit 1; }
          test -f "$outdir/resources/app.asar.unpacked/scripts/hatch-all.js" || { echo "::error::scripts/ not unpacked"; exit 1; }
          nfiles=$(find "$outdir" -type f | wc -l)
          [ "$nfiles" -ge 100 ] || { echo "::error::$outdir has only $nfiles files"; exit 1; }
          echo "packaged app: $nfiles files, app.asar $(du -h "$outdir/resources/app.asar" | cut -f1)"
          if [ '${{ startsWith(github.ref, 'refs/tags/v') }}' = 'true' ]; then
            # tagged release: the named archive that gets attached to the Release
            if [ "${{ runner.os }}" = "Windows" ]; then
              asset="Kip-$v-${{ matrix.name }}.zip"
              ( cd "$outdir" && 7z a -mx=5 "$ws/$asset" . >/dev/null )
            else
              asset="Kip-$v-${{ matrix.name }}.tar.gz"
              tar -C app/out -czf "$asset" "$(basename "$outdir")"
            fi
            echo "ASSET=$asset" >> "$GITHUB_ENV"
            { echo "ARTIFACT_PATH=$asset"; echo "ARTIFACT_COMPRESSION=0"; } >> "$GITHUB_ENV"
          else
            # manual / dev run: hand the folder to upload-artifact so it zips
            # once (no double-unzip for a test download) — #37
            { echo "ARTIFACT_PATH=$outdir"; echo "ARTIFACT_COMPRESSION=6"; } >> "$GITHUB_ENV"
          fi

      - name: Smoke test (linux — the bundled retrieval layer runs under Electron-as-Node)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          mkdir -p /tmp/coop/.roost
          # scripts/ is unpacked out of app.asar (see packaging/linux/build.sh)
          ELECTRON_RUN_AS_NODE=1 KIP_COOP_ROOT=/tmp/coop \
            app/out/Kip-linux-x64/kip \
            app/out/Kip-linux-x64/resources/app.asar.unpacked/scripts/reminders.js list --json

      - name: Smoke test (windows — the app launches and stays up)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # a codeless / crash-on-boot package (twice shipped during the asar
          # work) exits within a second — fail the build if Kip.exe doesn't
          # stay alive for 20s.
          $exe = "app\out\Kip-win32-x64\Kip.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--no-sandbox" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            $log = "$env:APPDATA\Kip\logs\main.log"
            if (Test-Path $log) { Write-Host "--- main.log ---"; Get-Content $log -Tail 40 }
            throw "Kip.exe exited within 20s (code $($p.ExitCode)) — package is not runnable"
          }
          Write-Host "Kip.exe still running after 20s — ok"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 5
          # 0 for tags (ARTIFACT_PATH is an already-compressed archive);
          # 6 for manual runs (ARTIFACT_PATH is the raw folder).
          compression-level: ${{ env.ARTIFACT_COMPRESSION }}

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag='${{ github.ref_name }}'
          ver="${tag#v}"
          notes=$'Kip **'"$tag"$'**\n\n'
          notes+=$'| Platform | File |\n|---|---|\n'
          notes+=$'| Windows 10/11 x64 | `Kip-*-windows-x64.zip` — extract, run `Kip.exe` |\n'
          notes+=$'| Linux x64 | `Kip-*-linux-x64.tar.gz` — `tar -xzf`, run `./kip` |\n\n'
          notes+=$'Windows SmartScreen: the binary is signed but the certificate is self-issued, so SmartScreen still shows *unknown publisher* — *More info → Run anyway*.\n'
          notes+=$'Linux/Wayland: `./kip --ozone-platform-hint=auto`.\n\n'
          # This release's section, lifted from the app changelog.
          section=$(awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' app/CHANGELOG.md)
          if [ -n "$section" ]; then
            notes+=$'---\n'
            notes+="$section"
            notes+=$'\n'
          fi
          notes+=$'Full changelog: https://github.com/JWE24-code/kip-app/blob/'"$tag"$'/CHANGELOG.md\n'
          notes+=$'Retrieval layer: https://github.com/JWE24-code/kip/blob/main/CHANGELOG.md\n'
          notes+=$'First-run guide: https://github.com/JWE24-code/kip/blob/main/docs/GETTING-STARTED.md'
          gh release create "$tag" --title "Kip $tag" \
            --notes "$notes" --repo "${{ github.repository }}" 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" "${{ env.ASSET }}" --clobber --repo "${{ github.repository }}"
