name: Bug report
description: Something in Kip is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Kip is v0.1 — thanks for helping shake it out. For questions or "does
        anyone else…", use [Discussions](https://github.com/JWE24-code/kip-app/discussions) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Screenshots or a short screen recording help.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a graph
        2. …
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Kip version
      description: Settings → About (or the release you downloaded)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows 11
        - Windows 10
        - Linux (Wayland)
        - Linux (X11)
        - Other (say which)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Peck (chat / answers)
        - Hatch (ingest)
        - Groom
        - Reminders
        - Skills
        - Settings / LLM provider
        - The editor / whiteboards
        - Install / launch
        - Something else
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant lines from the log. Windows: `%APPDATA%\Kip\logs\main.log`.
        Linux: `~/.config/Kip/logs/main.log`. Redact anything private.
      render: text
    validations:
      required: false
